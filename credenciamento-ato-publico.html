<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Credenciamento – Ato Público OAB/RS – 21/05/2026</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root {
  --azul:#003366; --azul2:#0055a4; --dourado:#c8a84b;
  --verde:#16a34a; --vermelho:#dc2626;
  --cinza:#6b7280; --bg:#f1f5f9; --branco:#fff; --borda:#e2e8f0; --txt:#0f172a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overscroll-behavior:none;}

/* ── WRAPPER TABLET ── */
.app-wrapper{max-width:900px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 40px rgba(0,0,0,.12);}

/* ── HEADER ── */
header{background:var(--azul);padding:13px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.35);position:sticky;top:0;z-index:200;}
.h-title{font-size:15px;font-weight:700;color:#fff;line-height:1.3;}
.h-sub{font-size:11.5px;color:rgba(255,255,255,.65);margin-top:2px;}
.sync-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;cursor:default;}
.sync-dot.on{background:rgba(22,163,74,.3);color:#4ade80;}
.sync-dot.off{background:rgba(220,38,38,.25);color:#fca5a5;}

/* ── STATS ── */
.stats{background:var(--azul2);display:flex;gap:10px;padding:9px 18px;}
.stat{flex:1;background:rgba(255,255,255,.15);border-radius:10px;padding:7px 10px;text-align:center;}
.stat-n{font-size:22px;font-weight:700;color:#fff;line-height:1.1;}
.stat-l{font-size:10.5px;color:rgba(255,255,255,.75);letter-spacing:.4px;margin-top:1px;}

/* ── TABS ── */
.tabs{display:flex;background:#fff;border-bottom:2px solid var(--borda);}
.tab{flex:1;padding:13px 8px;text-align:center;font-size:14px;font-weight:600;color:var(--cinza);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;user-select:none;transition:all .15s;}
.tab.active{color:var(--azul);border-bottom-color:var(--azul);}

/* ── PANEL ── */
.panel{display:none;}
.panel.active{display:block;}

/* ── CTRL BAR ── */
.ctrl{background:#fff;padding:10px 16px;display:flex;gap:8px;border-bottom:1px solid var(--borda);position:sticky;top:62px;z-index:100;}
.ctrl input[type=text]{flex:1;padding:9px 13px;border:1.5px solid var(--borda);border-radius:9px;font-size:15px;outline:none;}
.ctrl input:focus{border-color:var(--azul2);}
.ctrl select{padding:9px 8px;border:1.5px solid var(--borda);border-radius:9px;font-size:13px;background:#fff;max-width:180px;outline:none;}
.fab{background:var(--azul);color:#fff;border:none;border-radius:9px;width:42px;height:42px;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.fab:hover{background:var(--azul2);}

/* ── LIST ── */
.list{padding-bottom:80px;}
.ghdr{background:#f1f5f9;padding:7px 18px;font-size:11px;font-weight:700;color:var(--cinza);text-transform:uppercase;letter-spacing:.7px;border-top:1px solid var(--borda);border-bottom:1px solid var(--borda);display:flex;justify-content:space-between;align-items:center;}
.gcnt{font-size:11.5px;background:#e2e8f0;border-radius:10px;padding:2px 10px;}

.card{background:#fff;border-bottom:1px solid var(--borda);display:flex;align-items:center;padding:12px 16px;gap:11px;transition:background .1s;}
.card:hover{background:#f8fafc;}
.card.checked{background:#f0fdf4;}
.card.semnome{background:#fffbeb;}
.card.wi{border-left:4px solid var(--dourado);}

.chk{width:38px;height:38px;border-radius:50%;border:2px solid var(--borda);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;color:transparent;transition:all .15s;}
.chk:hover{border-color:var(--verde);}
.chk.done{background:var(--verde);border-color:var(--verde);color:#fff;}

.ci{flex:1;min-width:0;}
.cn{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cn.ag{color:var(--cinza);font-style:italic;font-weight:400;}
.cc{font-size:12.5px;color:var(--cinza);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ch{font-size:12px;color:var(--verde);font-weight:700;margin-top:3px;}

.wi-tag{display:inline-block;font-size:10px;background:#fef3c7;color:#92400e;border-radius:4px;padding:1px 6px;margin-left:5px;font-weight:600;vertical-align:middle;}
.rp-tag{display:inline-block;font-size:10px;background:#ede9fe;color:#5b21b6;border-radius:4px;padding:1px 6px;margin-left:5px;font-weight:600;vertical-align:middle;}
.eb-tag{display:inline-block;font-size:10px;background:#f0fdf4;color:#166534;border-radius:4px;padding:1px 6px;margin-left:5px;font-weight:600;vertical-align:middle;}

.ebtn{background:none;border:none;color:#cbd5e1;cursor:pointer;padding:6px 9px;border-radius:7px;font-size:16px;flex-shrink:0;}
.ebtn:hover{color:var(--azul2);background:#f1f5f9;}

/* ── CERIMONIAL ── */
.cer-ctrl{background:#fff;padding:11px 18px;border-bottom:1px solid var(--borda);display:flex;justify-content:space-between;align-items:center;}
.cer-count{font-size:14px;color:var(--cinza);font-weight:600;}
.btn-csv{background:var(--dourado);color:#fff;border:none;border-radius:9px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;}
.btn-csv:hover{opacity:.9;}
.cer-item{background:#fff;border-bottom:1px solid var(--borda);display:flex;align-items:center;padding:12px 18px;gap:12px;}
.cer-num{width:30px;height:30px;border-radius:50%;background:var(--azul);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cer-i{flex:1;min-width:0;}
.cer-n{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cer-c{font-size:12.5px;color:var(--cinza);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.cer-h{font-size:13px;color:var(--verde);font-weight:700;flex-shrink:0;min-width:65px;text-align:right;}

/* ── PILLS FILTRO CERIMONIAL ── */
.pills-bar{display:flex;gap:7px;padding:10px 14px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--borda);-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.pills-bar::-webkit-scrollbar{display:none;}
.pill{flex-shrink:0;padding:5px 13px;border-radius:20px;border:1.5px solid var(--borda);background:#fff;font-size:12.5px;font-weight:600;color:var(--cinza);cursor:pointer;white-space:nowrap;transition:all .15s;line-height:1.4;}
.pill:hover{border-color:var(--azul2);color:var(--azul2);}
.pill.active{background:var(--azul);border-color:var(--azul);color:#fff;}
.pill .pill-cnt{display:inline-block;background:rgba(255,255,255,.28);border-radius:10px;font-size:10.5px;padding:0 5px;margin-left:4px;font-weight:700;}
.pill:not(.active) .pill-cnt{background:#f1f5f9;color:var(--cinza);}

/* ── EMPTY ── */
.empty{text-align:center;padding:70px 20px;color:var(--cinza);}
.empty-ico{font-size:48px;margin-bottom:12px;}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:500;display:flex;align-items:flex-end;justify-content:center;}
.overlay.h{display:none;}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:680px;max-height:92vh;overflow-y:auto;padding:6px 24px 36px;animation:su .2s ease;}
@keyframes su{from{transform:translateY(60px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.m-drag{width:44px;height:4px;background:#d1d5db;border-radius:2px;margin:13px auto 18px;}
.m-title{font-size:17px;font-weight:700;color:var(--azul);margin-bottom:18px;}
.fgrp{margin-bottom:14px;}
.fl{font-size:12px;font-weight:600;color:var(--cinza);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:block;}
.fi,.fs{width:100%;padding:11px 13px;border:1.5px solid var(--borda);border-radius:9px;font-size:15px;outline:none;background:#fff;}
.fi:focus,.fs:focus{border-color:var(--azul2);}
.m-actions{display:flex;gap:9px;margin-top:20px;}
.btn{flex:1;padding:13px;border-radius:9px;font-size:15px;font-weight:600;border:none;cursor:pointer;}
.btn-p{background:var(--azul);color:#fff;}
.btn-p:hover{background:var(--azul2);}
.btn-s{background:#f1f5f9;color:var(--txt);}
.btn-s:hover{background:#e2e8f0;}
.btn-d{background:#fef2f2;color:var(--vermelho);}
.btn-d:hover{background:#fee2e2;}

/* ── CONFIRM ── */
#cfOverlay{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:600;display:flex;align-items:center;justify-content:center;padding:24px;}
#cfOverlay.h{display:none;}
.cfbox{background:#fff;border-radius:16px;padding:26px;max-width:420px;width:100%;}
.cf-nome{font-size:17px;font-weight:700;margin-bottom:5px;}
.cf-cargo{font-size:13px;color:var(--cinza);margin-bottom:20px;}
.cf-btns{display:flex;gap:9px;}

/* ── LOADING ── */
#loading{position:fixed;inset:0;background:var(--azul);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
.spin{width:52px;height:52px;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;margin-bottom:18px;}
@keyframes sp{to{transform:rotate(360deg);}}
#loading p{color:rgba(255,255,255,.75);font-size:15px;}

/* ── TOAST ── */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:11px 24px;border-radius:26px;font-size:14px;font-weight:500;z-index:999;transition:opacity .3s;white-space:nowrap;}
#toast.h{opacity:0;pointer-events:none;}

/* ── RESPONSIVE TABLET ── */
@media(min-width:600px){
  .h-title{font-size:17px;}
  .h-sub{font-size:13px;}
  .stat-n{font-size:26px;}
  .stat-l{font-size:11.5px;}
  .tab{font-size:15px;padding:15px 12px;}
  .ctrl input[type=text]{font-size:16px;padding:10px 15px;}
  .ctrl select{font-size:14px;max-width:220px;}
  .cn{font-size:15.5px;}
  .cc{font-size:13px;}
  .ch{font-size:12.5px;}
  .cer-n{font-size:15.5px;}
  .cer-c{font-size:13px;}
  .cer-h{font-size:14px;}
  .cer-num{width:34px;height:34px;font-size:13px;}
  .cer-item{padding:13px 20px;}
  .chk{width:42px;height:42px;font-size:20px;}
}
@media(min-width:768px){
  .h-title{font-size:19px;}
  .stat-n{font-size:28px;}
  .ghdr{font-size:12px;padding:8px 22px;}
  .ctrl{top:68px;}
}

.hidden{display:none!important;}
</style>
</head>
<body>

<div class="app-wrapper">
<!-- Loading -->
<div id="loading">
  <div class="spin"></div>
  <p>Conectando ao servidor...</p>
</div>

<!-- Header -->
<header>
  <div>
    <div class="h-title">Credenciamento – Ato Público OAB/RS</div>
    <div class="h-sub">21.05.2026 · 13h30 · Auditório Cubo</div>
  </div>
  <div class="sync-dot off" id="syncDot" title="Status da conexão">●</div>
</header>

<!-- Stats -->
<div class="stats">
  <div class="stat"><div class="stat-n" id="stTotal">–</div><div class="stat-l">TOTAL</div></div>
  <div class="stat"><div class="stat-n" id="stOk">–</div><div class="stat-l">CREDENCIADOS</div></div>
  <div class="stat"><div class="stat-n" id="stPend">–</div><div class="stat-l">PENDENTES</div></div>
  <div class="stat"><div class="stat-n" id="stWi">–</div><div class="stat-l">WALK-INS</div></div>
</div>

<!-- Tabs -->
<div class="tabs">
  <div class="tab active" data-tab="cred" onclick="switchTab('cred')">📋 Credenciamento</div>
  <div class="tab" data-tab="cer" onclick="switchTab('cer')">🎤 Cerimonial</div>
</div>

<!-- ═══ CREDENCIAMENTO ═══ -->
<div id="panel-cred" class="panel active">
  <div class="ctrl">
    <input type="text" id="busca" placeholder="🔍 Buscar nome ou cargo..." oninput="renderLista()">
    <select id="filtro" onchange="renderLista()">
      <option value="">Todos os grupos</option>
    </select>
    <button class="fab" onclick="abrirWI()" title="Adicionar walk-in">+</button>
  </div>
  <div class="list" id="listaCont"></div>
</div>

<!-- ═══ CERIMONIAL ═══ -->
<div id="panel-cer" class="panel">
  <div class="cer-ctrl">
    <span class="cer-count" id="cerCnt">0 presentes</span>
    <button class="btn-csv" onclick="exportCSV()">⬇ Exportar CSV</button>
  </div>
  <div class="pills-bar" id="pillsBar">
    <button class="pill active" data-grupo="todos" onclick="setPill(this,'todos')">Todos</button>
  </div>
  <div id="cerCont"></div>
</div>

<!-- ═══ MODAL WALK-IN ═══ -->
<div class="overlay h" id="wiOverlay" onclick="closeWI(event)">
  <div class="modal">
    <div class="m-drag"></div>
    <div class="m-title">Adicionar Presença</div>

    <div class="fgrp">
      <label class="fl">Nome Completo</label>
      <input type="text" class="fi" id="wNome" placeholder="Ex: João da Silva (opcional)">
    </div>
    <div class="fgrp">
      <label class="fl">Cargo / Instituição</label>
      <select class="fs" id="wCargoSel" onchange="onCargoSel()">
        <option value="">— Selecionar —</option>
        <option value="__custom__">✏️ Digitar manualmente</option>
        <option value="Presidente de Subseção" data-grupo="subsecoes">Presidente de Subseção</option>
        <option disabled>── Associações Jurídicas ──</option>
      </select>
    </div>
    <div class="fgrp hidden" id="wCargoCustomGrp">
      <label class="fl">Cargo (manual)</label>
      <input type="text" class="fi" id="wCargoCustom" placeholder="Digite o cargo ou instituição">
    </div>
    <div class="fgrp">
      <label class="fl">Grupo / Categoria</label>
      <select class="fs" id="wGrupo"></select>
    </div>
    <div class="fgrp">
      <label class="fl">Tipo de entrada</label>
      <select class="fs" id="wTipo">
        <option value="walkin">Walk-in (não previsto na lista)</option>
        <option value="repr">Representante de convidado previsto</option>
        <option value="externo">Externo / Imprensa / Convidado</option>
      </select>
    </div>

    <div class="m-actions">
      <button class="btn btn-s" onclick="closeWI({})">Cancelar</button>
      <button class="btn btn-p" onclick="salvarWI()">Registrar Presença</button>
    </div>
  </div>
</div>

<!-- ═══ MODAL EDIÇÃO ═══ -->
<div class="overlay h" id="editOverlay" onclick="closeEdit(event)">
  <div class="modal">
    <div class="m-drag"></div>
    <div class="m-title">Editar Cadastro</div>
    <input type="hidden" id="editId">

    <div class="fgrp">
      <label class="fl">Nome</label>
      <input type="text" class="fi" id="editNome" placeholder="Nome completo">
    </div>
    <div class="fgrp">
      <label class="fl">Cargo / Instituição</label>
      <input type="text" class="fi" id="editCargo">
    </div>
    <div class="fgrp">
      <label class="fl">Grupo</label>
      <select class="fs" id="editGrupo"></select>
    </div>
    <div class="fgrp">
      <label class="fl">Desfazer credenciamento</label>
      <button class="btn btn-s" style="font-size:12px;padding:8px;" onclick="desfazerCheckin()">↩ Desfazer check-in</button>
    </div>

    <div class="m-actions">
      <button class="btn btn-d" onclick="remover()">Remover</button>
      <button class="btn btn-s" onclick="closeEdit({})">Cancelar</button>
      <button class="btn btn-p" onclick="salvarEdit()">Salvar</button>
    </div>
  </div>
</div>

<!-- ═══ CONFIRM ═══ -->
<div id="cfOverlay" class="h">
  <div class="cfbox">
    <div class="cf-nome" id="cfNome"></div>
    <div class="cf-cargo" id="cfCargo"></div>
    <div class="cf-btns">
      <button class="btn btn-s" style="flex:1" onclick="closeCF()">Cancelar</button>
      <button class="btn btn-p" style="flex:1" id="cfBtn">✓ Confirmar presença</button>
    </div>
  </div>
</div>

<div id="toast" class="h"></div>
</div><!-- /app-wrapper -->

<script>
// ══════════════════════════════════════════
//  GRUPOS — ordem de precedência cerimonial
// ══════════════════════════════════════════
const GRUPOS = {

// ══════════════════════════════════════════
//  LISTA INICIAL DE CONVIDADOS

let state = {};

let toastTimer;

const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const genId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtH = iso => { if(!iso) return ''; const d=new Date(iso); return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); };

// ── HIERARQUIA DE CARGO (desempate interno por grupo) ──
function cargoOrdem(cargo){
  const c = norm(cargo||'');
  if(c.includes('vice')) return 3;
  if(c.includes('representando')||c.includes('em exerc')) return 2;
  if(c.includes('president')) return 1;
  if(c.includes('secretar')&&c.includes('adjunt')) return 5;
  if(c.includes('secretar')&&(c.includes('geral')||c.includes('-geral'))) return 4;
  if(c.includes('tesourei')||c.includes('diretor-tesourei')||c.includes('diretora-tesourei')) return 6;
  if(c.includes('corregedor')&&c.includes('geral')) return 7;
  if(c.includes('corregedor')&&c.includes('adjunt')) return 8;
  if(c.includes('ouvidor')) return 9;
  if(c.includes('acompanhante')) return 10;
  return 11;
}

async function initData(){
  const snap = await db.ref(PATH+'/pessoas').once('value');
  if(!snap.exists()){
    const batch = {};
    LISTA.forEach(p=>{
      const id = genId()+'_'+(Math.random()*99999|0);
      batch[id] = {nome:p.n||'', cargo:p.c||'', grupo:p.g||'walk-in', semNome:!!p.s, checkinAt:null, walkin:false, tipo:'lista'};
    });
    await db.ref(PATH+'/pessoas').set(batch);
  }
}

function subscribe(){
  db.ref(PATH+'/pessoas').on('value', snap=>{
    state = snap.val()||{};
    renderStats();
    renderLista();
    if(document.getElementById('panel-cer').classList.contains('active')) renderCer();
  });
  db.ref('.info/connected').on('value', snap=>{
    const d = document.getElementById('syncDot');
    d.className = snap.val() ? 'sync-dot on' : 'sync-dot off';
    d.title = snap.val() ? 'Conectado em tempo real ●' : 'Sem conexão ●';
  });
}

// ══════════════════════════════════════════
//  RENDER LISTA
// ══════════════════════════════════════════
function renderLista(){
  const busca = norm(document.getElementById('busca').value);
  const filtro = document.getElementById('filtro').value;
  const cont = document.getElementById('listaCont');

  const items = Object.entries(state)
    .map(([id,p])=>({id,...p}))
    .filter(p=>{
      if(filtro && p.grupo!==filtro) return false;
      if(busca) return norm(p.nome).includes(busca)||norm(p.cargo).includes(busca);
      return true;
    })
    .sort((a,b)=>{
      const oa=(GRUPOS[a.grupo]||{}).ordem||99, ob=(GRUPOS[b.grupo]||{}).ordem||99;
      if(oa!==ob) return oa-ob;
      const ca=cargoOrdem(a.cargo), cb=cargoOrdem(b.cargo);
      if(ca!==cb) return ca-cb;
      // subseções: alfabético por cargo/subseção; demais: por nome
      if(a.grupo==='subsecoes') return norm(a.cargo).localeCompare(norm(b.cargo));
      return norm(a.nome||a.cargo).localeCompare(norm(b.nome||b.cargo));
    });

  if(!items.length){
    cont.innerHTML='<div class="empty"><div class="empty-ico">🔍</div><div>Nenhum resultado</div></div>';
    return;
  }

  const byG={};
  items.forEach(p=>{ if(!byG[p.grupo]) byG[p.grupo]=[]; byG[p.grupo].push(p); });

  let html='';
  Object.entries(byG).forEach(([g,ps])=>{
    const grp=GRUPOS[g]||{label:g};
    const ok=ps.filter(p=>p.checkinAt).length;
    html+=`<div class="ghdr"><span>${esc(grp.label)}</span><span class="gcnt">${ok}/${ps.length}</span></div>`;
    ps.forEach(p=>{
      const chk=!!p.checkinAt;
      const sn=p.semNome&&!p.nome;
      const nd=sn?'(aguarda nomeação)':(p.nome||'(sem nome)');
      let tag='';
      if(p.walkin){
        if(p.tipo==='repr') tag='<span class="rp-tag">REPR.</span>';
        else if(p.tipo==='externo') tag='<span class="eb-tag">EXTERNO</span>';
        else tag='<span class="wi-tag">WALK-IN</span>';
      }
      html+=`<div class="card${chk?' checked':''}${sn?' semnome':''}${p.walkin?' wi':''}">
        <div class="chk${chk?' done':''}" onclick="tglChk('${p.id}')">${chk?'✓':''}</div>
        <div class="ci">
          <div class="cn${sn?' ag':''}">${esc(nd)}${tag}</div>
          <div class="cc">${esc(p.cargo||'')}</div>
          ${chk?`<div class="ch">✓ ${fmtH(p.checkinAt)}</div>`:''}
        </div>
        <button class="ebtn" onclick="abrirEdit('${p.id}')">✏️</button>
      </div>`;
    });
  });
  cont.innerHTML=html;
}

// ══════════════════════════════════════════
//  CHECK-IN
// ══════════════════════════════════════════
function tglChk(id){
  const p=state[id]; if(!p) return;
  if(p.checkinAt){
    // Undo: mostra confirmação
    pendingId=id;
    document.getElementById('cfNome').textContent=(p.nome||'(sem nome)');
    document.getElementById('cfCargo').textContent=p.cargo||'';
    document.getElementById('cfBtn').textContent='↩ Desfazer check-in';
    document.getElementById('cfBtn').onclick=desfazerCF;
    document.getElementById('cfOverlay').classList.remove('h');
  } else {
    pendingId=id;
    document.getElementById('cfNome').textContent=(p.nome||(p.semNome?'(aguarda nomeação)':'(sem nome)'));
    document.getElementById('cfCargo').textContent=p.cargo||'';
    document.getElementById('cfBtn').textContent='✓ Confirmar presença';
    document.getElementById('cfBtn').onclick=confirmarCF;
    document.getElementById('cfOverlay').classList.remove('h');
  }
}
function confirmarCF(){
  const id=pendingId; if(!id) return;
  const now=new Date().toISOString();
  db.ref(PATH+'/pessoas/'+id).update({checkinAt:now});
  toast('✓ Presença registrada às '+fmtH(now));
  closeCF();
}
function desfazerCF(){
  const id=pendingId; if(!id) return;
  db.ref(PATH+'/pessoas/'+id+'/checkinAt').set(null);
  toast('↩ Check-in desfeito');
  closeCF();
}
function closeCF(){ pendingId=null; document.getElementById('cfOverlay').classList.add('h'); }

//  WALK-IN
// ══════════════════════════════════════════
function abrirWI(){
  ['wNome','wCargoCustom'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('wCargoSel').value='';
  document.getElementById('wCargoCustomGrp').classList.add('hidden');
  document.getElementById('wTipo').value='walkin';
  document.getElementById('wGrupo').value='subsecoes';
  document.getElementById('wiOverlay').classList.remove('h');
}
function closeWI(e){ if(e&&e.target!==document.getElementById('wiOverlay')) return; document.getElementById('wiOverlay').classList.add('h'); }
function onCargoSel(){
  const v=document.getElementById('wCargoSel').value;
  document.getElementById('wCargoCustomGrp').classList.toggle('hidden',v!=='__custom__');
  const sel=document.getElementById('wCargoSel');
  const opt=sel.options[sel.selectedIndex];
  const wg=document.getElementById('wGrupo');
  if(opt&&opt.dataset.grupo) wg.value=opt.dataset.grupo;
  else if(v&&v!=='__custom__') wg.value='associacoes';
}
function salvarWI(){
  const nome=document.getElementById('wNome').value.trim();
  const cs=document.getElementById('wCargoSel').value;
  const cc=document.getElementById('wCargoCustom').value.trim();
  const cargo=cs==='__custom__'?cc:cs;
  const grupo=document.getElementById('wGrupo').value;
  const tipo=document.getElementById('wTipo').value;
  if(!cargo){ alert('Informe o cargo ou instituição.'); return; }
  const now=new Date().toISOString();
  db.ref(PATH+'/pessoas').push({nome,cargo,grupo:grupo||'walk-in',semNome:!nome,checkinAt:now,walkin:true,tipo});
  toast('✓ '+(nome||'Pessoa')+' adicionada e credenciada');
  closeWI({});
}

  document.getElementById('editNome').value=p.nome||'';
  document.getElementById('editCargo').value=p.cargo||'';
  document.getElementById('editGrupo').value=p.grupo||'walk-in';
  document.getElementById('editOverlay').classList.remove('h');
}
function closeEdit(e){ if(e&&e.target!==document.getElementById('editOverlay')) return; document.getElementById('editOverlay').classList.add('h'); }
function salvarEdit(){
  const id=document.getElementById('editId').value;
  const nome=document.getElementById('editNome').value.trim();
  const cargo=document.getElementById('editCargo').value.trim();
  const grupo=document.getElementById('editGrupo').value;
  db.ref(PATH+'/pessoas/'+id).update({nome,cargo,grupo,semNome:!nome});
  toast('Cadastro atualizado');
  closeEdit({});
}
function desfazerCheckin(){
  const id=document.getElementById('editId').value;
  db.ref(PATH+'/pessoas/'+id+'/checkinAt').set(null);
  toast('↩ Check-in desfeito');
  closeEdit({});
}
function remover(){
  const id=document.getElementById('editId').value;
  const p=state[id];
  if(!confirm('Remover '+(p?.nome||'esta pessoa')+'?')) return;
  db.ref(PATH+'/pessoas/'+id).remove();
  toast('Registro removido');
  closeEdit({});
}

// ══════════════════════════════════════════
//  CERIMONIAL
// ══════════════════════════════════════════
let cerGrupoAtivo = 'todos';

function cerSort(a,b){
  const oa=(GRUPOS[a.grupo]||{}).ordem||99, ob=(GRUPOS[b.grupo]||{}).ordem||99;
  if(oa!==ob) return oa-ob;
  const ca=cargoOrdem(a.cargo), cb=cargoOrdem(b.cargo);
  if(ca!==cb) return ca-cb;
  if(a.grupo==='subsecoes') return norm(a.cargo).localeCompare(norm(b.cargo));
  return norm(a.nome||a.cargo).localeCompare(norm(b.nome||b.cargo));
}

function setPill(el, grupo){
  cerGrupoAtivo = grupo;
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  renderCer();
}

function buildPills(presentes){
  // agrupa os presentes por grupo, mantendo ordem de precedência
  const bar = document.getElementById('pillsBar');
  // guarda pill ativo antes de reconstruir
  const ativo = cerGrupoAtivo;

  // quais grupos têm presentes
  const gruposComPresentes = Object.keys(GRUPOS)
    .filter(g => presentes.some(p => p.grupo === g))
    .sort((a,b) => (GRUPOS[a].ordem||99) - (GRUPOS[b].ordem||99));

  // monta HTML
  let html = `<button class="pill ${ativo==='todos'?'active':''}" data-grupo="todos" onclick="setPill(this,'todos')">Todos <span class="pill-cnt">${presentes.length}</span></button>`;
  gruposComPresentes.forEach(g => {
    const cnt = presentes.filter(p=>p.grupo===g).length;
    // label curto para caber na bolinha
    const labelFull = GRUPOS[g].label;
    const label = labelAbrev(labelFull);
    const isActive = ativo === g;
    html += `<button class="pill ${isActive?'active':''}" data-grupo="${g}" onclick="setPill(this,'${g}')">${esc(label)} <span class="pill-cnt">${cnt}</span></button>`;
  });
  bar.innerHTML = html;
}

// Abreviações para as pills não ficarem longas demais
function labelAbrev(label){
  const map = {
    'Mesa Principal – OAB/RS':            'Mesa',
    'CAARS / Extensão da Mesa':           'CAARS',
    'ESA / TED / Corregedoria':           'ESA/TED/Corr.',
    'Ex-Presidentes OAB/RS':              'Ex-Presidentes',
    'Conselheiros Federais':              'Cons. Federais',
    'Secretários de Estado do RS':        'Secretários Est.',
    'Ex-Governadores do RS':              'Ex-Governadores',
    'Senadores':                          'Senadores',
    'Deputados':                          'Deputados',
    'Vereadores de Porto Alegre':         'Vereadores',
    'Entidades Empresariais':             'Entidades',
    'Conselhos Profissionais':            'Conselhos',
    'Associações Jurídicas':              'Associações',
    'Presidentes de Subseções':           'Subseções',
    'Presidentes de Comissões':           'Comissões',
    'Coordenadores de Cursos de Direito': 'Coordenadores',
    'Walk-in / Externo':                  'Walk-in',
  };
  return map[label] || label;
}

function renderCer(){
  const cont=document.getElementById('cerCont');

  const todos=Object.entries(state)
    .map(([id,p])=>({id,...p}))
    .filter(p=>p.checkinAt)
    .sort(cerSort);

  document.getElementById('cerCnt').textContent=todos.length+' presente'+(todos.length!==1?'s':'');

  buildPills(todos);

  const list = cerGrupoAtivo==='todos' ? todos : todos.filter(p=>p.grupo===cerGrupoAtivo);

  if(!list.length){
    cont.innerHTML='<div class="empty"><div class="empty-ico">👥</div><div>Nenhum credenciamento ainda</div></div>';
    return;
  }

  let html='', lastG='', n=0;
  list.forEach(p=>{
    if(p.grupo!==lastG){
      const grpOk=list.filter(x=>x.grupo===p.grupo).length;
      html+=`<div class="ghdr"><span>${esc((GRUPOS[p.grupo]||{label:p.grupo}).label)}</span><span class="gcnt">${grpOk}</span></div>`;
      lastG=p.grupo;
    }
    n++;
    const sn=p.semNome&&!p.nome;
    const nd=sn?'(aguarda nomeação)':(p.nome||'(sem nome)');
    let tag='';
    if(p.walkin){
      if(p.tipo==='repr') tag='<span class="rp-tag">REPR.</span>';
      else if(p.tipo==='externo') tag='<span class="eb-tag">EXTERNO</span>';
      else tag='<span class="wi-tag">WALK-IN</span>';
    }
    html+=`<div class="cer-item">
      <div class="cer-num">${n}</div>
      <div class="cer-i">
        <div class="cer-n${sn?' ag':''}">${esc(nd)}${tag}</div>
        <div class="cer-c">${esc(p.cargo||'')}</div>
      </div>
      <div class="cer-h">${fmtH(p.checkinAt)}</div>
    </div>`;
  });
  cont.innerHTML=html;
}

// ══════════════════════════════════════════
//  EXPORT CSV
// ══════════════════════════════════════════
function exportCSV(){
  const list=Object.entries(state)
    .map(([id,p])=>({id,...p}))
    .filter(p=>p.checkinAt)
    .sort((a,b)=>{
      const oa=(GRUPOS[a.grupo]||{}).ordem||99, ob=(GRUPOS[b.grupo]||{}).ordem||99;
      if(oa!==ob) return oa-ob;
      const ca=cargoOrdem(a.cargo), cb=cargoOrdem(b.cargo);
      if(ca!==cb) return ca-cb;
      if(a.grupo==='subsecoes') return norm(a.cargo).localeCompare(norm(b.cargo));
      return norm(a.nome||a.cargo).localeCompare(norm(b.nome||b.cargo));
    });
  const rows=[['Nome','Cargo','Grupo','Horário de Chegada','Tipo']];
  list.forEach(p=>rows.push([p.nome||'',p.cargo||'',(GRUPOS[p.grupo]||{label:p.grupo||''}).label,fmtH(p.checkinAt),p.walkin?'Walk-in':'Lista']));
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='credenciamento-ato-publico-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  toast('✓ CSV exportado com '+list.length+' registros');
}

// ══════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.remove('h');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.add('h'),2800);
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    closeCF(); closeWI({}); closeEdit({});
  }
});
