*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0f8;color:#1a1a1a;font-size:15px}
.app{max-width:820px;margin:0 auto;padding:1rem}
.card{background:#fff;border-radius:14px;border:1px solid #ddd;overflow:hidden;margin-bottom:1rem}
.banner{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);padding:1.2rem 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.banner-title{color:#fff;font-size:17px;font-weight:700;flex:1}
.banner-sub{color:#a0b4cc;font-size:11px;margin-top:2px}
.hcnt{background:rgba(255,255,255,.15);border-radius:8px;padding:5px 12px;font-size:13px;color:#c8d8e8}
.hcnt strong{color:#fff;font-weight:700}
.tabs{display:flex;border-bottom:1px solid #e0e0e0;background:#f9f9f9}
.tab{padding:.7rem 1.5rem;font-size:13px;font-weight:500;color:#888;cursor:pointer;border:none;border-bottom:2px solid transparent;background:none}
.tab:hover{color:#0f3460}
.tab.active{color:#0f3460;border-bottom:2px solid #0f3460;background:#fff}
.pane{display:none}.pane.active{display:block}
.sr{padding:.65rem 1.25rem;border-bottom:1px solid #eee;display:flex;gap:8px}
.sr input{flex:1;font-size:14px;padding:0 12px;height:38px;border-radius:8px;border:1px solid #ccc;outline:none}
.sr input:focus{border-color:#0f3460;box-shadow:0 0 0 3px rgba(15,52,96,.12)}
.btn-add{height:38px;padding:0 16px;font-size:13px;font-weight:500;border-radius:8px;border:1px solid #ccc;background:#fff;color:#0f3460;cursor:pointer}
.btn-add:hover{background:#f0f4ff}
.export-row{padding:.4rem 1.25rem 0;display:flex;justify-content:flex-end}
.btn-exp{font-size:12px;padding:4px 12px;border-radius:7px;border:1px solid #ccc;background:#fff;color:#0f3460;cursor:pointer}
.list{max-height:520px;overflow-y:auto}
.grp{border-bottom:1px solid #f0f0f8}
.gh{padding:.5rem 1.25rem;background:#f5f5fb;display:flex;align-items:center;gap:8px;border-bottom:1px solid #ebebf5}
.gi{width:24px;height:24px;border-radius:50%;background:#c8d0e8;color:#0f3460;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.gn{font-size:12px;font-weight:700;color:#0f3460;text-transform:uppercase;letter-spacing:.04em;flex:1}
.gb{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid #ddd;color:#888}
.gb.ok{background:#E8F5E9;border-color:#81C784;color:#2E7D32}
.ml{padding:.2rem 1.25rem .3rem}
.mr{display:flex;align-items:center;gap:8px;padding:.45rem 0;border-bottom:1px solid #f8f8fc}
.mr:last-child{border-bottom:none}
.mi{flex:1;min-width:0}
.mn{font-size:13px;color:#1a1a1a}
.mn.chk{text-decoration:line-through;color:#aaa}
.ct{font-size:11px;color:#777;margin-top:2px}
.pill{display:inline-block;font-size:10px;padding:1px 6px;border-radius:5px;margin-left:4px;vertical-align:middle;font-weight:600}
.pvoc{background:#E8EAF6;color:#3949AB;border:1px solid #9FA8DA}
.paut{background:#F3E5F5;color:#7B1FA2;border:1px solid #D4A8E8}
.p14{background:#E3F2FD;color:#1565C0;border:1px solid #90CAF9}
.p17{background:#E8F5E9;color:#2E7D32;border:1px solid #81C784}
.pausente{background:#FFF9C4;color:#6D5500;border:1px solid #FFE57F}
.pwi{background:#FFF8E1;color:#8B6914;border:1px solid #FFE082}
.ra{display:flex;gap:5px;flex-shrink:0}
.btn{height:28px;padding:0 10px;font-size:12px;border-radius:7px;border:1px solid #ccc;background:#fff;color:#333;cursor:pointer}
.btn:hover{background:#f5f5f5}
.btn.bp{min-width:78px}
.btn.done{background:#E8F5E9;border-color:#81C784;color:#2E7D32}
.btn.ic{padding:0;width:28px;display:flex;align-items:center;justify-content:center}
.er{padding:.4rem 0;border-bottom:1px solid #f8f8fc}
.ef{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ef input,.ef select{font-size:12px;height:30px;border-radius:7px;border:1px solid #ccc;padding:0 8px;outline:none;flex:1;min-width:120px}
.empty{padding:2rem;text-align:center;color:#aaa;font-size:14px}
/* CERIMONIAL */
.ch{padding:.9rem 1.25rem .75rem;border-bottom:1px solid #eee;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.ch-title{font-size:15px;font-weight:700;flex:1;color:#0f3460}
.live{font-size:11px;padding:3px 10px;border-radius:6px;background:#E3F2FD;color:#1565C0;border:1px solid #90CAF9}
.cer-filters{padding:.5rem 1.25rem;border-bottom:1px solid #eee;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cf{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;border:1px solid #ccc;background:#fff;font-size:12px;font-weight:500;color:#888;cursor:pointer;user-select:none}
.cf .cfd{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cf.on{border-color:currentColor}
.cl{padding:.5rem 1.25rem 1rem;max-height:510px;overflow-y:auto}
.cg{margin-bottom:14px}
.cgh{padding:.4rem 0 .3rem;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;border-bottom:2px solid currentColor;margin-bottom:5px}
.cc{display:flex;align-items:center;gap:12px;padding:.75rem 1rem;border-radius:10px;margin-bottom:4px;border-left:4px solid transparent}
.cd{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.cn{font-size:16px;font-weight:700;color:#1a1a1a}
.cs2{font-size:11px;color:#666;margin-top:3px;line-height:1.4}
.cbadge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;flex-shrink:0;white-space:nowrap;border:1px solid transparent}
/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:1.4rem;width:400px;max-width:95vw;max-height:90vh;overflow-y:auto;border:1px solid #ddd}
.modal h3{font-size:15px;font-weight:700;margin-bottom:1rem;color:#0f3460}
.modal label{font-size:12px;color:#555;display:block;margin-bottom:3px;margin-top:10px}
.modal input,.modal select{width:100%;font-size:13px;height:34px;border-radius:8px;border:1px solid #ccc;padding:0 10px;outline:none}
.modal input:focus,.modal select:focus{border-color:#0f3460}
.tipo-row{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.tb{flex:1;height:30px;font-size:12px;border-radius:7px;border:1px solid #ccc;background:#fff;color:#888;cursor:pointer;font-weight:500;min-width:80px}
.tb.ac{background:#E3F2FD;border-color:#90CAF9;color:#0f3460}
.ma{display:flex;gap:8px;margin-top:1.2rem}
.ma button{flex:1;height:34px;font-size:13px;font-weight:600;border-radius:8px;border:1px solid #ccc;cursor:pointer}
.mc{background:#fff;color:#888}
.mk{background:#0f3460;border-color:#0f3460;color:#fff}

.sync-bar{padding:.35rem 1.25rem;font-size:11px;color:#aaa;border-top:1px solid #eee;display:flex;gap:6px;align-items:center}

<div class="app">
<div class="status-bar" id="status-bar"></div>
<div class="card">
  <div class="banner">
    <div style="flex:1">
      <div class="banner-title">Comenda Oswaldo Vergara 2026 — OAB/RS</div>
      <div class="banner-sub">Credenciamento · 14h e 17h</div>
    </div>
    <div style="display:flex;gap:8px">
      <div class="hcnt">Presentes: <strong id="cnt-p">0</strong></div>
      <div class="hcnt">Total: <strong id="cnt-t">0</strong></div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" id="tab-cr" onclick="switchTab('cr')">Credenciamento</button>
    <button class="tab" id="tab-cer" onclick="switchTab('cer')">Cerimonial</button>
  </div>
  <div class="pane active" id="pane-cr">
    <div class="export-row"><button class="btn-exp" onclick="exportCSV()">⬇ Exportar presenças</button></div>
    <div class="sr">
      <input type="text" id="search" placeholder="Buscar por nome ou cargo..." autocomplete="off" spellcheck="false" oninput="renderCr()">
      <button class="btn-add" onclick="openModal()">+ Adicionar</button>
    </div>
    <div class="list" id="list-area"><div class="empty">Conectando...</div></div>
  </div>
  <div class="pane" id="pane-cer">
    <div class="ch">
      <div class="ch-title">Presentes no evento</div>
      <div class="hcnt" style="background:#E3F2FD;color:#0f3460">Total: <strong id="cer-cnt">0</strong></div>
      <div class="live">ao vivo</div>
    </div>
    <div class="cer-filters" id="cer-filters"></div>
    <div class="cl" id="cer-list"><div class="empty">Nenhuma presença registrada ainda.</div></div>
  </div>
  <div class="sync-bar">
    <div class="sd" id="sd"></div>
    <span id="ss">Conectando...</span>
    <span style="flex:1"></span><span id="st"></span>
  </div>
</div>
</div>

<!-- MODAL ADICIONAR -->
<div class="overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>Adicionar participante</h3>
    <div class="tipo-row">
      <button class="tb ac" id="tipo-acomp" onclick="setTipo('acomp')">Acompanhante</button>
      <button class="tb" id="tipo-hom" onclick="setTipo('hom')">Homenageado(a)</button>
      <button class="tb" id="tipo-voc" onclick="setTipo('voc')">Autoridade</button>
      <button class="tb" id="tipo-ext" onclick="setTipo('ext')">Outro</button>
    </div>
    <label>Nome completo</label>
    <input type="text" id="m-nome" placeholder="Nome da pessoa" autocomplete="off">
    <div id="bloco-acomp">
      <label>Acompanhante de:</label>
      <input type="text" id="m-homenageado" placeholder="Nome do(a) homenageado(a)" autocomplete="off" list="hom-list">
      <datalist id="hom-list"></datalist>
    </div>
    <div id="bloco-hom" style="display:none">
      <label>Sessão</label>
      <select id="m-sessao"><option value="h14">14h</option><option value="h17">17h</option></select>
    </div>
    <div id="bloco-voc" style="display:none">
      <label>Cargo / Instituição</label>
      <input type="text" id="m-cargo-voc" placeholder="ex.: Conselheiro Federal" autocomplete="off">
    </div>
    <div id="bloco-ext" style="display:none">
      <label>Cargo / Observação</label>
      <input type="text" id="m-cargo-ext" placeholder="ex.: Convidado da mesa" autocomplete="off">
    </div>
    <div class="ma">
      <button class="mc" onclick="closeModal()">Cancelar</button>
      <button class="mk" onclick="confirmModal()">Adicionar e registrar presença</button>
    </div>
  </div>
</div>

// ── FUNÇÕES ──────────────────────────────────────────────────────────────────
function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function sk(s){return s.replace(/[.#$\/\[\]'"]/g,"_");}
function getKeyA(a){return sk("aut|||"+a.n);}
function getKeyB(b){return sk("hom|||"+b.n);}
function isChecked(key){var v=state.checkins[key];return v===true||(v&&v.checked);}
function getTime(key){var v=state.checkins[key];return (v&&v.time)?v.time:(v===true?"—":null);}
function nowTime(){return new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});}

var state={checkins:{},extras:{}};
var editingKey=null;
var activeTab="cr";
var cerFilters={};
CATS.forEach(function(c){cerFilters[c.id]=true;});
var saving=false;
var modalTipoVal="acomp";

function allItems(){
  var list=[];
  AUTORIDADES.forEach(function(a){
    list.push({n:a.n,c:a.c,cat:a.cat,key:getKeyA(a),tipo:"aut"});
  });
  BASE.forEach(function(b){
    list.push({n:b.n,c:b.c,cat:b.cat,key:getKeyB(b),tipo:"base",ausente:!!b.ausente});
  });
  Object.keys(state.extras||{}).forEach(function(uid){
    var ex=state.extras[uid];
    list.push({n:ex.nome,c:ex.cargo,cat:ex.cat||"acomp",key:sk("extra|||"+uid),tipo:"extra",uid:uid});
  });
  return list;
}

function renderCr(){
  var q=norm((document.getElementById("search").value||"").trim());
  var items=allItems();
  var total=0,chkd=0;
  items.forEach(function(m){total++;if(isChecked(m.key))chkd++;});
  document.getElementById("cnt-p").textContent=chkd;
  document.getElementById("cnt-t").textContent=total;

  var groups={};
  var catOrder=["voc","aut","h14","h17","est","acomp","conv"];
  catOrder.forEach(function(id){groups[id]=[];});
  items.forEach(function(m){
    var cat=m.cat||"acomp";
    var match=!q||(norm(m.n).includes(q)||norm(m.c).includes(q));
    if(match) (groups[cat]||groups["conv"]).push(m);
  });

  var html="";
  catOrder.forEach(function(catId){
    var grp=groups[catId];
    if(!grp.length)return;
    var s=cs(catId);
    var chkG=grp.filter(function(m){return isChecked(m.key);}).length;
    var rows=grp.map(function(m){
      var chk=isChecked(m.key);
      if(editingKey===m.key){
        return '<div class="er"><div class="ef">'
          +'<input type="text" id="edit-nome" value="'+m.n.replace(/"/g,"&quot;")+'" autocomplete="off">'
          +'<button class="btn" style="background:#0f3460;border-color:#0f3460;color:#fff" data-action="save-edit" data-key="'+m.key+'">Salvar</button>'
          +'<button class="btn" onclick="cancelEdit()">✕</button>'
          +'</div></div>';
      }
      var tags="";
      if(m.cat==="voc") tags+='<span class="pill pvoc">vocativo</span>';
      else if(m.cat==="aut") tags+='<span class="pill paut">autoridade</span>';
      else if(m.cat==="h14") tags+='<span class="pill p14">14h</span>';
      else if(m.cat==="h17") tags+='<span class="pill p17">17h</span>';
      if(m.ausente) tags+='<span class="pill pausente">ausência justificada</span>';
      if(m.tipo==="extra") tags+='<span class="pill pwi">walk-in</span>';
      var t=chk&&getTime(m.key)?'<span style="font-size:11px;color:#aaa;margin-left:5px">⏱ '+getTime(m.key)+'</span>':"";
      return '<div class="mr"><div class="mi">'
        +'<span class="mn'+(chk?" chk":"")+'">'+m.n+tags+'</span>'+t
        +'<div class="ct">'+m.c+'</div></div>'
        +'<div class="ra">'
        +'<button class="btn bp'+(chk?" done":"")+'" data-action="toggle" data-key="'+m.key+'">'+(chk?"Presente":"Registrar")+'</button>'
        +'<button class="btn ic" data-action="edit" data-key="'+m.key+'">✏</button>'
        +'</div></div>';
    }).join("");
    var catLabel={voc:"Autoridades / Vocativo",aut:"Autoridades OAB/RS",est:"Conselheiros(as) Estaduais",h14:"Homenageados(as) 14h",h17:"Homenageados(as) 17h",acomp:"Acompanhantes",conv:"Convidados"};
    html+='<div class="grp"><div class="gh">'
      +'<div class="gi" style="background:'+s.bg+';color:'+s.tc+'">'+catLabel[catId][0]+'</div>'
      +'<div class="gn" style="color:'+s.dot+'">'+catLabel[catId]+'</div>'
      +'<div class="gb'+(chkG===grp.length&&grp.length>0?" ok":"")+'">'+chkG+'/'+grp.length+'</div>'
      +'</div><div class="ml">'+rows+'</div></div>';
  });
  document.getElementById("list-area").innerHTML=html||'<div class="empty">Nenhum resultado.</div>';
}

function renderCer(){
  var items=allItems();
  var present=items.filter(function(m){return isChecked(m.key);});
  document.getElementById("cer-cnt").textContent=present.length;
  var groups={};
  CATS.forEach(function(c){groups[c.id]=[];});
  present.forEach(function(m){var cat=m.cat||"acomp";if(groups[cat])groups[cat].push(m);});
  CATS.forEach(function(cat){groups[cat.id].sort(function(a,b){return a.n.localeCompare(b.n,"pt-BR");});});
  buildCerFilters(groups);
  var html="";
  CATS.forEach(function(cat){
    if(!cerFilters[cat.id])return;
    var grp=groups[cat.id];
    if(!grp.length)return;
    var s=cs(cat.id);
    html+='<div class="cg"><div class="cgh" style="color:'+s.dot+'">'+cat.label+' — '+grp.length+' presente'+(grp.length>1?"s":"")+'</div>'
      +grp.map(function(m){
        var t=getTime(m.key);
        return '<div class="cc" style="background:'+s.bg+';border:1px solid '+s.bc+';border-left-color:'+s.dot+'">'
          +'<div class="cd" style="background:'+s.dot+'"></div>'
          +'<div style="flex:1;min-width:0"><div class="cn">'+m.n+'</div>'
          +'<div class="cs2">'+m.c+(t?' · ⏱ '+t:'')+'</div></div>'
          +'<div class="cbadge" style="background:'+s.bg+';color:'+s.tc+';border-color:'+s.bc+'">'+cat.label+'</div>'
          +'</div>';
      }).join("")+"</div>";
  });
  document.getElementById("cer-list").innerHTML=html||'<div class="empty">Nenhuma presença registrada ainda.</div>';
}

function buildCerFilters(groups){
  var div=document.getElementById("cer-filters");
  div.innerHTML='<span style="font-size:11px;color:#aaa;margin-right:4px">Mostrar:</span>';
  CATS.forEach(function(cat){
    if(!(groups&&(groups[cat.id]||[]).length))return;
    var on=cerFilters[cat.id];
    var s=cs(cat.id);
    var btn=document.createElement("button");
    btn.className="cf"+(on?" on":"");
    btn.style.borderColor=on?s.dot:"#ccc";
    btn.style.color=on?s.dot:"#aaa";
    btn.innerHTML='<span class="cfd" style="background:'+(on?s.dot:"#ccc")+'"></span>'+cat.label;
    btn.onclick=function(){cerFilters[cat.id]=!cerFilters[cat.id];buildCerFilters(groups);renderCer();};
    div.appendChild(btn);
  });
}

function render(){renderCr();if(activeTab==="cer")renderCer();}

function toggle(key){
  if(isChecked(key)){delete state.checkins[key];}
  else{state.checkins[key]={checked:true,time:nowTime()};}
  render();saveToFb();
}
function startEdit(key){editingKey=key;renderCr();}
function cancelEdit(){editingKey=null;renderCr();}
function saveEdit(key){editingKey=null;renderCr();saveToFb();}

function switchTab(t){
  activeTab=t;
  ["cr","cer"].forEach(function(id){
    document.getElementById("tab-"+id).className="tab"+(t===id?" active":"");
    document.getElementById("pane-"+id).className="pane"+(t===id?" active":"");
  });
  if(t==="cer")renderCer();
}

function setTipo(t){
  modalTipoVal=t;
  ["acomp","hom","voc","ext"].forEach(function(id){
    var btn=document.getElementById("tipo-"+id);
    var bloco=document.getElementById("bloco-"+id);
    if(btn)btn.className="tb"+(t===id?" ac":"");
    if(bloco)bloco.style.display=t===id?"":"none";
  });
}
function openModal(){
  document.getElementById("m-nome").value="";
  if(document.getElementById("m-homenageado"))document.getElementById("m-homenageado").value="";
  var dl=document.getElementById("hom-list");
  if(dl){
    dl.innerHTML="";
    BASE.filter(function(b){return b.cat==="h14"||b.cat==="h17";}).forEach(function(b){
      var o=document.createElement("option");o.value=b.n;dl.appendChild(o);
    });
  }
  setTipo("acomp");
  document.getElementById("modal").classList.add("open");
  setTimeout(function(){document.getElementById("m-nome").focus();},50);
}
function closeModal(){document.getElementById("modal").classList.remove("open");}
function confirmModal(){
  var nome=document.getElementById("m-nome").value.trim();
  if(!nome)return;
  var uid="x"+Date.now()+Math.floor(Math.random()*9999);
  var cat,cargo;
  if(modalTipoVal==="acomp"){
    var hom=(document.getElementById("m-homenageado")||{}).value||"";
    cargo=hom.trim()?"Acompanhante de "+hom.trim():"Acompanhante";cat="acomp";
  }else if(modalTipoVal==="hom"){
    var sessao=document.getElementById("m-sessao").value;
    cargo="Homenageado(a) — "+(sessao==="h14"?"14h":"17h");cat=sessao;
  }else if(modalTipoVal==="voc"){
    cargo=(document.getElementById("m-cargo-voc")||{}).value||"Autoridade";cat="voc";
  }else{
    cargo=(document.getElementById("m-cargo-ext")||{}).value||"Convidado(a)";cat="conv";
  }
  state.extras[uid]={nome:nome,cargo:cargo,cat:cat};
  state.checkins[sk("extra|||"+uid)]={checked:true,time:nowTime()};
  closeModal();render();saveToFb();
}

function exportCSV(){
  var rows=[["Nome","Categoria","Cargo","Horário"]];
  var catLabel={voc:"Autoridade/Vocativo",aut:"Autoridade",est:"Conselheiro(a) Estadual",h14:"Homenageado 14h",h17:"Homenageado 17h",conv:"Convidado(a)",acomp:"Acompanhante"};
  allItems().forEach(function(m){
    if(isChecked(m.key))rows.push([m.n,catLabel[m.cat]||m.cat,m.c,getTime(m.key)||"—"]);
  });
  var csv="\uFEFF"+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(";");}).join("\n");
  try{
    var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url;a.download="presencas_ov_"+new Date().toLocaleDateString("pt-BR").replace(/\//g,"-")+".csv";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},2000);
  }catch(e){}
}

document.addEventListener("click",function(e){
  var btn=e.target.closest("[data-action]");
  if(!btn)return;
  var action=btn.dataset.action,key=btn.dataset.key;
  if(action==="toggle")toggle(key);
  if(action==="edit")startEdit(key);
  if(action==="save-edit")saveEdit(key);
});

function saveToFb(){
  if(!dbRef||saving)return;
  saving=true;setSt("sy");
  dbRef.set({checkins:state.checkins,extras:state.extras}).then(function(){
    setSt("ok");
  }).catch(function(e){
    setSt("er");
    document.getElementById("status-bar").textContent="ERRO: "+(e.message||e);
    document.getElementById("status-bar").className="status-bar show";
  }).finally(function(){saving=false;});
}
function setSt(s){
  var dot=document.getElementById("sd"),st=document.getElementById("ss"),tm=document.getElementById("st");
  dot.className="sd"+(s==="ok"?" ok":s==="sy"?" sy":" er");
  st.textContent=s==="ok"?"Sincronizado":s==="sy"?"Salvando...":"Sem Firebase";
  if(s==="ok")tm.textContent=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
